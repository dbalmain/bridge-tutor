[package]
name = "bridge-system"
version = "0.1.0"
edition = "2021"
description = "ABF Standard Five-Card Majors decision tree, deal finder, and drill weights"
license = "MIT"

[lib]
name = "bridge_system"

[[bin]]
name = "bridge-system"
path = "src/main.rs"

[dependencies]
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
